<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00182F" />
    <title>Login — Maximum Imóveis</title>
    <link rel="icon" href="../assets/favicon.ico?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-login-body">
    <main class="admin-login">
      <a class="admin-login-logo" href="../index.html" aria-label="Voltar ao site">
        <img src="/assets/logo trans.png" alt="Maximum Imóveis" />
      </a>
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="login-card-heading">
        <p class="eyebrow">Área restrita</p>
        <h1 id="loginTitle">Painel Administrativo</h1>
        <p class="login-subtitle">Gerencie a presença digital da Maximum Imóveis.</p>
        </div>
        <form id="loginForm">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
          <label for="password">Senha</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" id="togglePassword" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <button class="admin-primary" id="loginSubmit" type="submit">Entrar no painel</button>
        </form>
        <p class="backend-notice" id="loginNotice" role="status" hidden></p>
      </section>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>

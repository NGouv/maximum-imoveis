<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações — Maximum Imóveis</title>
    <link rel="icon" href="../assets/favicon.ico?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar">
      <a class="admin-sidebar-brand" href="../index.html"><img src="../assets/logo trans.png" alt="Maximum Imóveis" /><span>ÁREA ADMINISTRATIVA</span></a>
      <p class="admin-nav-label">Menu</p>
      <nav aria-label="Navegação administrativa">
        <a href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/><rect x="3" y="14" width="8" height="7" rx="1"/></svg><span>Visão geral</span></a>
        <a href="imoveis.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V8l7-4 7 4v12M9 20v-6h6v6M9 9h.01M15 9h.01"/></svg><span>Imóveis</span></a>
        <a class="active" href="configuracoes.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.7Z"/></svg><span>Configurações</span></a>
      </nav>
      <div class="admin-sidebar-bottom"><span>Maximum Imóveis</span><a class="admin-logout" href="login.html"><span aria-hidden="true">↗</span>Sair</a></div>
    </aside>
    <main class="admin-main">
      <header class="admin-page-header"><div><p class="eyebrow">Sistema</p><h1>Configurações</h1><p>Atualize as informações institucionais da Maximum.</p></div></header>
      <div class="admin-backend-note" id="adminNotice" role="status" hidden></div>
      <form class="admin-settings" id="settingsForm">
        <div class="admin-settings-heading"><div><p class="admin-section-kicker">Dados da empresa</p><h2>Informações básicas</h2></div></div>
        <label>Nome da imobiliária<input name="nome" maxlength="160" required /></label>
        <label>Logotipo (URL)<input name="logotipo" type="url" /></label>
        <label>Telefone<input name="telefone" /></label>
        <label>WhatsApp (somente números)<input name="whatsapp" inputmode="numeric" /></label>
        <label>E-mail<input name="email" type="email" /></label>
        <label>Instagram (usuário ou URL)<input name="instagram" /></label>
        <label class="property-description">Endereço<input name="endereco" /></label>
        <div class="settings-actions"><button class="admin-primary" id="saveSettings" type="submit">Salvar configurações</button></div>
      </form>
    </main>
    <script type="module" src="configuracoes.js"></script>
  </body>
</html>
